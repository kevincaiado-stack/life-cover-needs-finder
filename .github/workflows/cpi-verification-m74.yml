name: M74 CPI verification and live endpoint smoke
on:
  push:
    branches: [main]
    paths:
      - api/inflation.js
      - needs-finder.html
      - tests/cpi-live-readiness-m74.test.cjs
      - tests/cpi-production-smoke-m74.cjs
      - .github/workflows/cpi-verification-m74.yml
  workflow_dispatch:
jobs:
  cpi-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/inflation.js
      - run: node --test tests/inflation.test.cjs tests/cpi-rollover-m71.test.cjs tests/cpi-source-link-m72.test.cjs tests/cpi-live-readiness-m74.test.cjs
  production-smoke:
    runs-on: ubuntu-latest
    needs: cpi-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/cpi-production-smoke-m74.cjs
