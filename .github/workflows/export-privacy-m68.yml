name: M68 export privacy source regression
on:
  push:
    branches: [main]
    paths:
      - needs-finder.html
      - tests/export-privacy-m68.test.cjs
      - .github/workflows/export-privacy-m68.yml
  workflow_dispatch:
jobs:
  export-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/export-privacy-m68.test.cjs tests/pdf-download.test.cjs
