name: M57 product catalog consistency
on:
  push:
    branches: [main]
    paths:
      - 'needs-finder.html'
      - 'tests/product-catalog-consistency.test.cjs'
      - '.github/workflows/product-catalog-consistency.yml'
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/product-catalog-consistency.test.cjs
