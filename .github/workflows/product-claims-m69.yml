name: M69 product claims safeguards
on:
  push:
    branches: [main]
    paths:
      - needs-finder.html
      - tests/product-claims-m69.test.cjs
      - .github/workflows/product-claims-m69.yml
  workflow_dispatch:
jobs:
  product-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/product-claims-m69.test.cjs tests/approved-product-copy.test.cjs tests/eligibility-boundaries.test.cjs tests/income-suitability.test.cjs
