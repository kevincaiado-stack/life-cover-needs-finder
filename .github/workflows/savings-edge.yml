name: M54 savings edge regression
on:
  push:
    branches: [main]
    paths:
      - 'needs-finder.html'
      - 'tests/savings-edge.test.cjs'
      - '.github/workflows/savings-edge.yml'
  workflow_dispatch:
jobs:
  savings-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/savings-edge.test.cjs
