name: M71 official CPI rollover readiness
on:
  push:
    branches: [main]
    paths:
      - api/inflation.js
      - needs-finder.html
      - tests/cpi-rollover-m71.test.cjs
      - .github/workflows/cpi-rollover-m71.yml
  workflow_dispatch:
jobs:
  cpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cpi-rollover-m71.test.cjs tests/inflation.test.cjs
