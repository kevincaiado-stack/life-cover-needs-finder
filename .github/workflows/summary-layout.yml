name: M60 saved summary layout regression
on:
  push:
    branches: [main]
    paths:
      - 'needs-finder.html'
      - 'tests/summary-layout.test.cjs'
      - '.github/workflows/summary-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summary-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/summary-layout.test.cjs
      - run: node --test tests/approved-product-copy.test.cjs tests/eligibility-boundaries.test.cjs tests/income-suitability.test.cjs tests/savings-edge.test.cjs tests/product-catalog-consistency.test.cjs
